replicas: 1

ingress:
  host: dev.sellgar.io

configmaps:
  - nameOverride: storefront-env
    enabled: true
    filename: .env
    data: |
      CLIENT_GATEWAY_URL=http://client-gateway:8080
      PUBLIC_CLIENT_GATEWAY_URL=http://dev.sellgar.io/api/client
      PUBLIC_SOCKET_GATEWAY_URL=http://dev.sellgar.io
