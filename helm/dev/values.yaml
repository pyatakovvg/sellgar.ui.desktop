replicas: 1

ingress:
  host: dev.sellgar.ru
  tlsSecretName: sellgar-dev-tls

configmaps:
  - nameOverride: storefront-env
    enabled: true
    filename: .env
    data: |
      CLIENT_GATEWAY_URL=http://client-gateway:8080
      PUBLIC_CLIENT_GATEWAY_URL=https://dev.sellgar.ru/api/client
      PUBLIC_SOCKET_GATEWAY_URL=https://dev.sellgar.ru
